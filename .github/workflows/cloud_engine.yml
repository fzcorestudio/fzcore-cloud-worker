name: 24/7 Autonomous Cloud Outbound & Harvester Engine

on:
  schedule:
    # Runs continuously every 35 minutes around the clock (unlimited free cloud minutes on public repo)
    - cron: '*/35 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual Trigger'
        required: false
        default: 'run_cycle'

concurrency:
  group: fzcore-cloud-fleet
  cancel-in-progress: false

jobs:
  autonomous-engine:
    name: 24/7 Cloud Outbound Fleet
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 🚀 Run Autonomous 24/7 Cloud Cycle
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SUBDOMAIN_MAIL_PASS: ${{ secrets.SUBDOMAIN_MAIL_PASS }}
          WARREN_MAIL_PASS: ${{ secrets.WARREN_MAIL_PASS }}
          FORWARD_TARGET_EMAIL: ${{ secrets.FORWARD_TARGET_EMAIL }}
        run: |
          python run_worker.py
