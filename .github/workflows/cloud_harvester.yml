name: 24/7 Dedicated High-Volume Lead Harvester Fleet

on:
  schedule:
    # Runs continuously every 20 minutes (72 cycles/day = 1,500 to 2,000+ leads/24 hr)
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: fzcore-cloud-harvester
  cancel-in-progress: false

jobs:
  harvester-engine:
    name: High-Volume Playwright Lead Fleet
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 🚀 Run Dedicated Lead Harvest
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SUBDOMAIN_MAIL_PASS: ${{ secrets.SUBDOMAIN_MAIL_PASS }}
          WARREN_MAIL_PASS: ${{ secrets.WARREN_MAIL_PASS }}
          FORWARD_TARGET_EMAIL: ${{ secrets.FORWARD_TARGET_EMAIL }}
        run: |
          python harvest_standalone.py
